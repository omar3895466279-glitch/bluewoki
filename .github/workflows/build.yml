name: Build bluewoki IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA unsigned
        run: |
          xcodebuild -project bluewoki.xcodeproj -target bluewoki -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES ARCHS="armv7" IPHONEOS_DEPLOYMENT_TARGET=3.0 -derivedDataPath build
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r bluewoki-unsigned.ipa Payload/
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: bluewoki-unsigned-ipa
          path: bluewoki-unsigned.ipa
