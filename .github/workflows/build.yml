name: Build bluewoki IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.2
        run: sudo xcode-select -s /Applications/Xcode_15.2.app
      - name: Build unsigned IPA
        run: |
          xcodebuild -project bluewoki.xcodeproj -target bluewoki -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES ARCHS="armv7 armv7s" IPHONEOS_DEPLOYMENT_TARGET=6.0 -derivedDataPath build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/bluewoki.app Payload/
          rm -f Payload/bluewoki.app/_CodeSignature -R || true
          zip -r bluewoki-unsigned.ipa Payload/
          mkdir -p artifact
          mv bluewoki-unsigned.ipa artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: bluewoki-unsigned-ipa
          path: artifact/bluewoki-unsigned.ipa
